[package]
name = "legion-tui-bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bench"
path = "src/bench.rs"

[[bin]]
name = "idle"
path = "src/idle.rs"

[[bin]]
name = "hello"
path = "src/hello.rs"

[[bin]]
name = "launch"
path = "src/launch.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
